<g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(17.28 309.28)">
<title id="title">S3 access through STS</title>
<desc id="description">The client gets an identity-provider token, exchanges it at STS for a key, secret, and session token, signs an S3 request with SigV4, and receives data after the gateway checks access.</desc>
