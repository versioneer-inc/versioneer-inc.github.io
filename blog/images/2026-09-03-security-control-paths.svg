<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="650"
  viewBox="0 0 1200 650"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Kubernetes platform security control paths</title>
  <desc id="description">
    Pod Security Admission and Kyverno check workload changes. Trivy scans
    deployed state. Falco detects activity while workloads run. Grafana Alloy
    sends Falco JSON events to Loki. User requests enter through APISIX, which
    uses Keycloak identity and OPA authorization. All paths produce operator
    evidence.
  </desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="8"
        flood-color="#173042"
        flood-opacity="0.10"
      />
    </filter>
    <marker
      id="arrow"
      markerWidth="14"
      markerHeight="14"
      refX="12"
      refY="7"
      orient="auto"
      markerUnits="userSpaceOnUse"
      viewBox="0 0 14 14"
    >
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#53758a" />
    </marker>
  </defs>

  <rect
    x="8"
    y="8"
    width="1184"
    height="634"
    rx="32"
    fill="#f6f9fb"
    stroke="#dce6ec"
    stroke-width="2"
  />

  <text
    x="60"
    y="52"
    fill="#496574"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="16"
    font-weight="700"
    letter-spacing="2.2"
  >
    SECURITY CONTROLS AND OPERATOR EVIDENCE
  </text>

  <text
    x="60"
    y="93"
    fill="#167a9f"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="14"
    font-weight="800"
    letter-spacing="1.4"
  >
    WORKLOAD LIFECYCLE
  </text>

  <g filter="url(#shadow)">
    <rect x="40" y="112" width="165" height="86" rx="18" fill="#ffffff" />
    <rect x="245" y="100" width="170" height="110" rx="18" fill="#ffffff" />
    <rect x="455" y="100" width="210" height="110" rx="18" fill="#ffffff" />
    <rect x="705" y="100" width="210" height="110" rx="18" fill="#ffffff" />
    <rect x="955" y="100" width="205" height="110" rx="18" fill="#ffffff" />
  </g>

  <text x="122.5" y="148" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">Workload spec</text>
  <text x="122.5" y="174" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">defines desired state</text>

  <text x="330" y="137" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="750">Pod Security</text>
  <text x="330" y="160" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="750">Admission</text>
  <text x="330" y="184" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">checks new Pods</text>

  <text x="560" y="137" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">Kyverno</text>
  <text x="560" y="164" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">checks object policy</text>
  <text x="560" y="187" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">and creates reports</text>

  <text x="810" y="137" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">Trivy Operator</text>
  <text x="810" y="164" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">scans deployed state</text>
  <text x="810" y="187" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">and creates reports</text>

  <text x="1057.5" y="137" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">Falco</text>
  <text x="1057.5" y="164" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">detects activity</text>
  <text x="1057.5" y="187" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">while workloads run</text>

  <path d="M217 155 H233" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M427 155 H443" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M677 155 H693" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M927 155 H943" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />

  <text
    x="60"
    y="265"
    fill="#5b58a5"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="14"
    font-weight="800"
    letter-spacing="1.4"
  >
    USER REQUEST
  </text>

  <g filter="url(#shadow)">
    <rect x="60" y="284" width="190" height="86" rx="18" fill="#ffffff" />
    <rect x="330" y="272" width="260" height="110" rx="18" fill="#ffffff" />
    <rect x="650" y="272" width="220" height="110" rx="18" fill="#ffffff" />
    <rect x="930" y="284" width="210" height="86" rx="18" fill="#ffffff" />
  </g>

  <text x="155" y="320" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">External request</text>
  <text x="155" y="346" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">enters the public route</text>

  <text x="460" y="309" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">APISIX gateway</text>
  <text x="460" y="336" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">intercepts and enforces</text>
  <text x="460" y="359" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">the access decision</text>

  <text x="760" y="307" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">Keycloak: identity</text>
  <text x="760" y="336" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">OPA: allow or deny</text>
  <text x="760" y="361" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">supports the gateway decision</text>

  <text x="1035" y="320" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">Platform service</text>
  <text x="1035" y="346" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">receives allowed traffic</text>

  <path d="M262 327 H312" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M602 327 H632" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M882 327 H912" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />

  <rect
    x="375"
    y="410"
    width="450"
    height="38"
    rx="19"
    fill="#e6f3ed"
  />
  <text
    x="600"
    y="435"
    text-anchor="middle"
    fill="#287b5b"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="13"
    font-weight="800"
    letter-spacing="1.1"
  >
    ALL CONTROL PATHS PRODUCE OPERATOR EVIDENCE
  </text>

  <text
    x="60"
    y="468"
    fill="#2f8c67"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="14"
    font-weight="800"
    letter-spacing="1.4"
  >
    EVIDENCE AND RESPONSE
  </text>

  <g filter="url(#shadow)">
    <rect x="300" y="482" width="260" height="104" rx="18" fill="#ffffff" />
    <rect x="610" y="482" width="260" height="104" rx="18" fill="#ffffff" />
    <rect x="920" y="482" width="220" height="104" rx="18" fill="#ffffff" />
  </g>

  <text x="430" y="522" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">Policy, scan, runtime,</text>
  <text x="430" y="548" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">and request evidence</text>
  <text x="430" y="572" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">supports investigation</text>

  <text x="740" y="522" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">Alloy, Prometheus,</text>
  <text x="740" y="548" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">Loki, and Grafana</text>
  <text x="740" y="572" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">detect and present evidence</text>

  <text x="1030" y="522" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">Alertmanager</text>
  <text x="1030" y="548" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">and Keep</text>
  <text x="1030" y="572" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">route the response</text>

  <path d="M572 534 H592" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M882 534 H902" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
</svg>
