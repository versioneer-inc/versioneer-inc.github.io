<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title description">
  <title id="title">Enforce the STAC namespace boundary at the Kubernetes API</title>
  <desc id="description">The process sends its restricted token to the vCluster API. After token validation, the demo profile role maps to a namespace RoleBinding for edit in stac-fastapi-pgstac. The notebook checks Job creation, cluster-role creation, and Pod listing in kube-system with kubectl auth can-i. Only namespace Job creation is allowed. It then submits a real export Job.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="none" stroke="#587281" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #173042; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 19px; }
      .line { fill: none; stroke: #587281; stroke-width: 2.5; marker-end: url(#arrow); }
      .box { fill: #fff; stroke: #b9cdd6; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="790" rx="20" fill="#f6f9fb"/>
  <text x="60" y="64" class="heading">One token, three Kubernetes permission checks</text>
  <text x="60" y="102" class="body">Saved notebook run: demo profile in ws-alice / vc0</text>

  <rect x="60" y="155" width="270" height="140" rx="12" class="box"/>
  <text x="195" y="193" text-anchor="middle" class="label">Process</text>
  <text x="195" y="230" text-anchor="middle" class="body">Restricted user token</text>
  <text x="195" y="265" text-anchor="middle" class="small">No cluster-admin role</text>
  <path d="M330 225H414" class="line"/>

  <rect x="420" y="155" width="360" height="140" rx="12" fill="#fff2d8" stroke="#d6b875" stroke-width="1.5"/>
  <text x="600" y="193" text-anchor="middle" class="label">vCluster API</text>
  <text x="600" y="230" text-anchor="middle" class="body">Validate token + map roles</text>
  <text x="600" y="265" text-anchor="middle" class="small">Issuer / signature / audience / expiry</text>
  <path d="M780 225H864" class="line"/>

  <rect x="870" y="155" width="270" height="140" rx="12" class="box"/>
  <text x="1005" y="193" text-anchor="middle" class="label">RoleBinding</text>
  <text x="1005" y="230" text-anchor="middle" class="body">edit</text>
  <text x="1005" y="265" text-anchor="middle" class="small">in stac-fastapi-pgstac</text>

  <path d="M1005 295V347H600V385" class="line"/>
  <text x="600" y="418" text-anchor="middle" class="label">RBAC checks each operation and its target</text>
  <path d="M600 438V465H225V500" class="line"/>
  <path d="M600 465V500" class="line"/>
  <path d="M600 465H975V500" class="line"/>

  <rect x="60" y="508" width="330" height="150" rx="12" fill="#e6f3ed" stroke="#a5caba" stroke-width="1.5"/>
  <text x="225" y="547" text-anchor="middle" class="label">ALLOWED</text>
  <text x="225" y="585" text-anchor="middle" class="body">Create Jobs</text>
  <text x="225" y="622" text-anchor="middle" class="body">in stac-fastapi-pgstac</text>

  <rect x="435" y="508" width="330" height="150" rx="12" fill="#fbeeee" stroke="#d8a9a9" stroke-width="1.5"/>
  <text x="600" y="547" text-anchor="middle" class="label">DENIED</text>
  <text x="600" y="585" text-anchor="middle" class="body">List Pods</text>
  <text x="600" y="622" text-anchor="middle" class="body">in kube-system</text>

  <rect x="810" y="508" width="330" height="150" rx="12" fill="#fbeeee" stroke="#d8a9a9" stroke-width="1.5"/>
  <text x="975" y="547" text-anchor="middle" class="label">DENIED</text>
  <text x="975" y="585" text-anchor="middle" class="body">Create</text>
  <text x="975" y="622" text-anchor="middle" class="body">ClusterRoles</text>

  <text x="600" y="712" text-anchor="middle" class="body">kubectl auth can-i checks authorization; the export Job also completed.</text>
  <text x="600" y="752" text-anchor="middle" class="small">Any broader binding to the user or a retained group would add permissions and defeat this limit.</text>
</svg>
